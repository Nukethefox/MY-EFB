<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MY EFB</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="app-shell">
  <main class="landing">
    <section class="card card-centered">
      <h1 class="title">MY EFB</h1>
      <form id="username-form" class="username-form">
        <label for="username-input" class="status">Write your SimBrief Username to see a <b>detailed but easy-to-understand</b> breakdown of your latest flight plan.<br><br>Please make sure the following settings are selected when creating a new flight: <br>- Detailed Navlog<br>- Runway Analysis<br>- NOTAMS</label>
        <input id="username-input" name="username" type="text" autocomplete="off" spellcheck="false" required>
        <button type="submit">Apply</button>
      </form>
      <p id="form-status" class="status">Please note that your username is not stored. Read more about privacy <a href="privacy.html" target="_blank">here</a>.</p>
    </section>
  </main>
</body>
</html>
